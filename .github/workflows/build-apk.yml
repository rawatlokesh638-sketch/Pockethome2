name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare Debug APK
        id: prepare_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" -type f | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          mkdir -p output_apk
          cp "$APK_FILE" output_apk/HomeExpenseTracker-debug.apk
          echo "apk_path=output_apk/HomeExpenseTracker-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeExpenseTracker-debug-apk
          path: output_apk/HomeExpenseTracker-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v${{ github.run_number }}
          name: Home Expense Tracker Debug APK (Build #${{ github.run_number }})
          body: |
            ### 📱 Home Expense Tracker - Debug APK

            Download the standalone APK directly below to install on your mobile phone without unzipping:
            
            - **File**: `HomeExpenseTracker-debug.apk`
            - **Commit**: `${{ github.sha }}`
            - **Build**: `#${{ github.run_number }}`
          files: output_apk/HomeExpenseTracker-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
