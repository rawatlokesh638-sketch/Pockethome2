name: Build APK and Deploy Website

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Mobile ya GitHub UI se 1-click trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "android-build"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Android APK & Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Locate Gradle Project Directory
        id: locate_dir
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Gradle project in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Ensure Keystores Exist (Release and Debug)
        env:
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          PROJECT_DIR="${{ steps.locate_dir.outputs.project_dir }}"
          STORE_PASS="${SECRET_STORE_PASSWORD:-Pk#9xL@2026$PocketHome!Key}"
          STORE_PASS=$(echo "$STORE_PASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          KEY_PASS="${SECRET_KEY_PASSWORD:-$STORE_PASS}"
          KEY_PASS=$(echo "$KEY_PASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")

          # Debug keystore
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            if [ -f "$PROJECT_DIR/debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d "$PROJECT_DIR/debug.keystore.base64" > "$PROJECT_DIR/debug.keystore"
            else
              echo "Generating debug.keystore..."
              keytool -genkey -v -keystore "$PROJECT_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Release keystore (my-upload-key.jks)
          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Restoring my-upload-key.jks from GitHub Secret..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/my-upload-key.jks"
          elif [ ! -f "$PROJECT_DIR/my-upload-key.jks" ] && [ -f "$PROJECT_DIR/my-upload-key.jks.base64" ]; then
            echo "Decoding my-upload-key.jks from repository base64..."
            base64 -d "$PROJECT_DIR/my-upload-key.jks.base64" > "$PROJECT_DIR/my-upload-key.jks"
          fi

          # Validate and synchronize keystore passwords
          if [ -f "$PROJECT_DIR/my-upload-key.jks" ]; then
            echo "Testing existing keystore with provided STORE_PASSWORD..."
            if keytool -list -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass "$STORE_PASS" -alias upload >/dev/null 2>&1; then
              echo "Keystore validation successful with configured STORE_PASSWORD."
            else
              echo "Keystore cannot be opened with STORE_PASSWORD. Checking default credentials..."
              if keytool -list -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass 'Pk#9xL@2026$PocketHome!Key' -alias upload >/dev/null 2>&1; then
                echo "Keystore matches default password. Updating store and key password to match GitHub Secret..."
                keytool -storepasswd -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass 'Pk#9xL@2026$PocketHome!Key' -new "$STORE_PASS"
                keytool -keypasswd -alias upload -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass "$STORE_PASS" -keypass 'Pk#9xL@2026$PocketHome!Key' -new "$KEY_PASS"
                echo "Keystore passwords updated successfully."
              else
                echo "Keystore mismatch. Generating fresh release keystore with provided secrets..."
                rm -f "$PROJECT_DIR/my-upload-key.jks"
                keytool -genkey -v -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass "$STORE_PASS" -alias upload -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PocketHome, OU=PocketHome, O=PocketHome, L=Delhi, ST=Delhi, C=IN"
              fi
            fi
          else
            echo "Generating release keystore in $PROJECT_DIR with configured passwords..."
            keytool -genkey -v -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass "$STORE_PASS" -alias upload -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PocketHome, OU=PocketHome, O=PocketHome, L=Delhi, ST=Delhi, C=IN"
          fi

          echo "Final validation check:"
          keytool -list -keystore "$PROJECT_DIR/my-upload-key.jks" -storepass "$STORE_PASS" -alias upload

      - name: Make Gradlew Executable
        run: |
          PROJECT_DIR="${{ steps.locate_dir.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Release and Debug APKs with Gradle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PROJECT_DIR="${{ steps.locate_dir.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          STORE_PASS="${SECRET_STORE_PASSWORD:-Pk#9xL@2026$PocketHome!Key}"
          STORE_PASS=$(echo "$STORE_PASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          KEY_PASS="${SECRET_KEY_PASSWORD:-$STORE_PASS}"
          KEY_PASS=$(echo "$KEY_PASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")

          export STORE_PASSWORD="$STORE_PASS"
          export KEY_PASSWORD="$KEY_PASS"
          export KEY_ALIAS="upload"
          export KEYSTORE_PATH="$PROJECT_DIR/my-upload-key.jks"

          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APKs for Website & Releases
        id: prepare_apk
        run: |
          mkdir -p output_apk
          mkdir -p public
          mkdir -p docs

          # Locate Release APK
          RELEASE_APK=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK at: $RELEASE_APK"
            cp "$RELEASE_APK" output_apk/Pockethome-release.apk
            cp "$RELEASE_APK" public/pockethome.apk
            cp "$RELEASE_APK" docs/pockethome.apk
            echo "release_apk=output_apk/Pockethome-release.apk" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Release APK not found!"
          fi

          # Locate Debug APK
          DEBUG_APK=$(find . -name "*debug*.apk" -type f | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at: $DEBUG_APK"
            cp "$DEBUG_APK" output_apk/Pockethome-debug.apk
            echo "debug_apk=output_apk/Pockethome-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pockethome-release-apk
          path: output_apk/Pockethome-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pockethome-debug-apk
          path: output_apk/Pockethome-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Create GitHub Release with Direct APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pockethome Release v1.0 (Build #${{ github.run_number }})
          body: |
            ### 📱 Pockethome - Smart Indian Home Expense Tracker & AI Money Growth

            Download the APK files directly below:

            - 🚀 **Release Signed APK (Recommended)**: `Pockethome-release.apk` (Signed with upload key, ready for install & production)
            - 🛠️ **Debug APK**: `Pockethome-debug.apk`
            - **Commit**: `${{ github.sha }}`
            - **Build**: `#${{ github.run_number }}`
          files: |
            output_apk/Pockethome-release.apk
            output_apk/Pockethome-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup GitHub Pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact for GitHub Pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
