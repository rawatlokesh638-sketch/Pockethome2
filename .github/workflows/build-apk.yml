name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Mobile se 1-click trigger ke liye

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Locate Gradle Project Directory
        id: locate_dir
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Gradle project in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Ensure Debug Keystore Exists
        run: |
          PROJECT_DIR="${{ steps.locate_dir.outputs.project_dir }}"
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            echo "Generating debug.keystore in $PROJECT_DIR..."
            keytool -genkey -v -keystore "$PROJECT_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Make Gradlew Executable
        run: |
          PROJECT_DIR="${{ steps.locate_dir.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          PROJECT_DIR="${{ steps.locate_dir.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare Debug APK
        id: prepare_apk
        run: |
          APK_FILE=$(find . -name "*.apk" -type f | grep -E "debug|app-debug" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          mkdir -p output_apk
          cp "$APK_FILE" output_apk/HomeExpenseTracker-debug.apk
          echo "apk_path=output_apk/HomeExpenseTracker-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeExpenseTracker-debug-apk
          path: output_apk/HomeExpenseTracker-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v${{ github.run_number }}
          name: Home Expense Tracker Debug APK (Build #${{ github.run_number }})
          body: |
            ### 📱 Home Expense Tracker - Debug APK

            Download the standalone APK directly below to install on your mobile phone without unzipping:
            
            - **File**: `HomeExpenseTracker-debug.apk`
            - **Commit**: `${{ github.sha }}`
            - **Build**: `#${{ github.run_number }}`
          files: output_apk/HomeExpenseTracker-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
